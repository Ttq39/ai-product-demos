function render(){document.body.classList.toggle('share-notes-off',!annotations);if(!annotations)document.getElementById('shareReviewNote')?.remove();$('.viewer')?.remove();const app=$('#app');app.className='app'+(shared?' shared':'')+(mode==='mobile'?' mobile':'')+(drawer?' drawer':'');$('#web').classList.toggle('active',mode==='web');$('#mobile').classList.toggle('active',mode==='mobile');let header,content,footer;const ms=msgs();if(shared){header='<span class="title">YiliBuddy <small>来自分享的对话</small></span>';const bad=!snapshot||viewer==='revoked'||(shareExpired(snapshot)&&!snapshot.loaded);content=viewer==='login'?'<div class="empty"><p>登录后查看分享内容</p><button id="login" class="primary">登录 YiliBuddy</button></div>':bad?`<div class="empty"><h2>${snapshot&&shareExpired(snapshot)?'该链接已过期':'该分享链接暂时无法访问'}</h2><p>请返回 YiliBuddy</p></div>`:!shareUnlocked(snapshot)?passwordGate():`<div class="thread"><div class="shared-label">该对话来自分享，由 AI 生成，请仔细甄别。</div><h2>${title}</h2><div class="shared-meta">分享时间 ${fmt(snapshot.created)}<br>失效时间 ${shareTTL(snapshot)}</div>${snapshot.messages.map(m=>message(m,true)).join('')}</div>`;footer='<div class="shared-footer"><button class="primary" id="new">快速新建对话</button></div>'}else{header=`<button id="drawer" class="mobile-only" aria-label="会话列表">${icon('menu')}</button><span class="title">${ms.length?title:'YiliBuddy'}</span><button class="share-icon web-only" aria-label="分享" data-tip="分享" id="shareTop" ${ms.length?'':'hidden'}>${icon('share')}</button><button class="mobile-only" id="audio" aria-label="声音">${icon('sound')}</button>`;content=ms.length?`<div class="thread ${selecting?'selecting':''}">${ms.map(m=>message(m)).join('')}</div>`:welcome();footer=selecting?`<div class="selectionbar"><label><input id="all" type="checkbox" ${selected.size===eligible().length?'checked':''}>全选</label><span>已选 ${selected.size} 条消息</span><span class="grow"></span><button id="exit">取消</button><button class="primary" id="confirm" ${selected.size?'':'disabled'}>创建分享链接</button></div>`:'<div class="composer"><input id="input" placeholder="输入指令或 @引用消息" aria-label="消息输入"><div class="composer-actions"><span>＋</span><span>♧ 非涉密模型</span><span>♙ 总是询问</span><button class="send" id="send" aria-label="发送">↑</button></div></div><div class="footnote">内容由 AI 生成 · 交互演示使用虚构数据</div><nav class="bottomnav"><span><b>▧</b>趋势</span><span><b>◇</b>服务</span><span class="active"><b>YILI</b>YILI-AI</span><span><b>◎</b>互动</span><span><b>☻</b>我的</span></nav>'}
app.innerHTML=(shared?'':side())+`<main class="main"><div class="status"><span>14:07</span><span>▮▮▮ 5G ▰</span></div><header class="header">${header}</header><div class="scroll">${content}</div>${footer}</main>`+(modal?dialog():'');bind();if(shared&&snapshot)viewControls();renderNotes();$('.stage').style.height=`calc(100dvh - ${$('.lab').offsetHeight}px)`}

const SHARE_REVIEW=[
{title:'有效期',rules:'1天、3天、1周、永久四选一，默认永久。已选蓝框浅蓝底；设置后才创建。限时从生成成功时计算，复制或转发不重算，历史链接不变。',error:'关闭设置不创建；生成失败保留选择；永久无自然到期时间。',trace:'FR-S01/02 · AC-S01/02'},

{title:'链接与复制',rules:'只读链接与蓝色“一键复制”按钮同一行。开启密码时复制链接、换行及“提取密码：密码内容”；关闭密码只复制链接。产物主动复制，会话结果交付后按同一格式自动复制；重复复制不改变链接或密码，URL本身不含密码。',error:'失败保留完整链接可手动复制。关闭已交付结果不撤回；生成中关闭按取消处理。',trace:'FR-S02/07 · AC-S02/07'},

function shareHint(){return '<span class="share-short-hint">仅限伊利员工登录后查看，请勿分享敏感信息。 <button type="button" class="share-info" aria-label="分享说明" title="每次分享生成独立链接，分享后暂不支持主动撤回。" data-share-info>ⓘ</button></span>'}
const shareCopySecrets=new Map();

function shareLinkRow(url,id,copyId,action,state){return `<div class="share-section-head share-link-heading">分享链接 ${shareNote(2)}</div><div class="share-link-row"><input id="${id}" readonly aria-label="分享链接" value="${esc(url)}"><button type="button" id="${copyId}" class="share-copy" data-action="${action}" ${state==='working'?'disabled':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></svg>${state==='working'?'复制中…':state==='success'?'已复制':'一键复制'}</button></div>`}
function newShareSettings(){wcStatus='';wcBusy=false;wcFailed=false;shareDraft={days:0,enabled:false,password:''};shareSettingsError=''}
function readShareFields(){const days=document.querySelector('input[name=shareDays]:checked');if(days)shareDraft.days=Number(days.value);const p=document.getElementById('sharePassword');if(p)shareDraft.password=p.value;shareDraft.enabled=!!document.getElementById('passwordEnabled')?.checked;return !shareDraft.enabled||/^(?=.*[a-z])(?=.*\d)[a-z0-9]{6}$/.test(shareDraft.password)}
function randomSharePassword(){const alphabet='abcdefghjkmnpqrstuvwxyz23456789';let s='';do{const b=crypto.getRandomValues(new Uint32Array(6));s=Array.from(b,x=>alphabet[x%alphabet.length]).join('')}while(!/[a-z]/.test(s)||!/[0-9]/.test(s));shareDraft.password=s;document.getElementById('sharePassword').value=s;shareSettingsError=''}
async function shareHash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')}
const shareUnlocked=l=>!l?.passwordHash||sessionStorage.getItem('share-unlocked-'+l.id)===l.passwordHash;

async function wcOpen(link,title,desc){if(wcBusy)return;wcLast={link,title,desc};wcBusy=true;wcStatus='';wcFailed=false;render();const params={title,desc,link,imgUrl:new URL('/assets/yilibuddy-share.png',location.href).href};window.shareSdkLastCall={method:'ww.shareAppMessage',params,mode:'mock'};let outcome;

if(outcome?.canceled||/cancel/i.test(outcome?.errMsg||outcome?.err_msg||''))return;if(outcome?.errCode&&outcome.errCode!==0)throw new Error('sdk_failed');wcStatus='已分享';}catch(e){if(/cancel/i.test(e?.errMsg||e?.message||'')){wcStatus='';return}wcFailed=true;wcStatus='分享失败，请重试或复制链接后发送。'}finally{wcBusy=false;render()}}

function shareGenerationDialog(title,closeAttrs,cancelAttrs,failed=false,retryAttrs=''){return `<div class="overlay"><section class="dialog share-dialog share-generation-dialog" role="dialog" aria-modal="true" aria-label="${title}"><div class="dialog-title"><span>${title} ${shareNote(4)}</span><button type="button" ${closeAttrs} aria-label="${failed?'关闭提示':'关闭生成'}">×</button></div><div class="share-progress-line" role="status">${failed?'':'<span class="share-spinner" aria-hidden="true"></span>'}<span>${failed?'链接生成失败，请重试。':'正在准备静态快照…'}</span></div><div class="notice">${failed?'本次未发布链接，分享内容与设置保留。':'关闭或取消将终止本次生成，不复制或交付链接。'}</div><div class="bottom"><button type="button" ${cancelAttrs}>${failed?'关闭':'取消生成'}</button>${failed?`<button type="button" class="share-primary" ${retryAttrs}>重试</button>`:''}</div></section></div>`}
// END shared share-dialog component
function dialog(){if(modal==='loading')return shareGenerationDialog('分享会话','id="close"','id="cancel"');if(modal==='error')return shareGenerationDialog('分享会话','id="close"','id="cancel"',true,'id="retry"');let body='',actions='';if(modal==='menu'){body='<button class="nav" id="menuShare">复制链接</button>'}else if(modal==='confirm'){body=`<p>已选择 ${selected.size} 条消息，按原顺序分享。</p><div class="notice"><span class="share-short-hint">仅限伊利员工登录后查看，请勿分享敏感信息。 <button type="button" class="share-info" aria-label="分享说明" title="每次分享生成独立链接，分享后暂不支持主动撤回。" data-share-info>ⓘ</button></span></div>${shareFields()}<div></div>`;actions='<button class="outline" id="cancel">取消</button><button class="primary" id="create">确认并复制链接</button>'}else if(modal==='missing'){body='<p>以下内容无法包含在分享中，继续分享将使用占位说明。</p><div class="notice">第 2 组回答 · 协作步骤示意图片<br>图片资源不允许共享，其余已选文字仍可分享。</div>';actions='<button class="outline" id="cancel">取消</button><button class="primary" id="continue">仍然分享</button>'}else if(modal==='result'){body=`<p>${shareHint()}</p>${shareLinkRow(url(),'url','copyAgain','copyConversation',copyBusy?'working':copyOK?'success':'idle')}<div class="share-result-meta"><p>有效期：${shareTTL(snapshot)}</p>${snapshot.passwordHash?`<p>访问密码：<input readonly aria-label="本次访问密码" value="${esc(shareCopySecrets.get(snapshot.id)||'')}"></p>`:''}</div>${copyOK||copyBusy?'':shareCopyFailure('自动复制失败，请手动复制。',shareCopyText(url(),shareCopySecrets.get(snapshot.id)))}${wcButton()}`;actions='<button id="cancel">完成</button>'}return `<div class="overlay"><section class="dialog share-dialog" role="dialog" aria-modal="true" aria-label="创建分享链接"><div class="dialog-head"><h2>${modal==='menu'?'会话操作':'分享会话'}</h2><button id="close" class="close" aria-label="关闭">×</button></div>${body}<div class="actions">${actions}</div></section></div>`}
const url=()=>location.href.split('#')[0]+'#share='+snapshot.id;async function copyLink(){if(copyBusy||!snapshot)return;copyBusy=true;copyOK=false;const current=snapshot.id;const value=shareCopyText(url(),shareCopySecrets.get(current));if(modal==='result')render();let ok=false;if(scene!=='copyfail'){try{await navigator.clipboard.writeText(value);ok=true}catch(e){}}log('share_copy_result',{link_id:current,result:ok?'success':'failed'});copyBusy=false;if(snapshot?.id!==current)return;copyOK=ok;if(modal==='result'){render();if(ok)toast('链接已复制')}}
async function create(allowMissing=false){if(modal==='confirm'&&!readShareFields()){shareSettingsError='请输入6位小写字母和数字，且须同时包含两者。';render();return}if(scene==='missing'&&selected.has('a2')&&!allowMissing){modal='missing';render();return}const chosen=msgs().filter(m=>selected.has(m.id)&&m.done).map(m=>({...m}));if(!chosen.length)return;const t=++token;const config={days:shareDraft.days,enabled:shareDraft.enabled,password:shareDraft.password};modal='loading';render();const passwordHash=config.enabled?await shareHash(config.password):null;if(t!==token)return;log('share_create_start',{selected_message_count:chosen.length});setTimeout(async()=>{if(t!==token)return;if(scene==='createfail'||(scene==='resourcefail'&&selected.has('a2'))){modal='error';log('share_create_result',{result:'failed'});render();return}if(allowMissing){const m=chosen.find(m=>m.id==='a2');if(m)m.html=m.html.replace(chart,'<div class="placeholder">该内容未包含在分享中 · 图片</div>')}const now=Date.now();snapshot={id:'demo-'+now.toString(36)+'-'+Math.random().toString(36).slice(2,7),created:now,expires:config.days?now+config.days*86400000:null,passwordHash,messages:chosen,selectionMode:chosen.length===eligible().length?'all':'partial'};rememberShareCopy(snapshot.id,passwordHash,config.password);store[snapshot.id]=snapshot;save();log('share_create_result',{result:'success',link_id:snapshot.id,selection_mode:snapshot.selectionMode,selected_message_count:chosen.length});modal='result';render();await copyLink()},1400)}
function openShared(){shared=true;selecting=false;drawer=false;modal='';viewer='allowed';snapshot.loaded=!shareExpired(snapshot)&&shareUnlocked(snapshot);render();if(snapshot.loaded)log('share_view_result',{link_id:snapshot.id,result:'success',is_sharer:false})}
function viewControls(){$('.viewer')?.remove();const n=document.createElement('div');n.className='viewer';n.innerHTML='<span>访问演示：</span><button id="viewLogin">未登录</button><button id="expire">模拟到期</button><button id="refresh">重新请求</button>';$('.lab').append(n);$('#viewLogin').onclick=()=>{viewer='login';snapshot.loaded=false;sessionStorage.removeItem('share-unlocked-'+snapshot.id);render()};$('#expire').onclick=()=>{if(snapshot.expires==null){toast('永久链接没有自然到期时间，请创建限时链接验收');return}snapshot.expires=Date.now()-1;store[snapshot.id]={...snapshot,loaded:false};save();toast('已模拟自然到期，当前内容保留；重新请求后提示失效')};$('#refresh').onclick=()=>{snapshot.loaded=false;render()}}
function newChat(){cancel();shared=false;selecting=false;drawer=false;scene='empty';$('#scene').value=scene;history.replaceState(null,'',location.href.split('#')[0]);render()}
function bind(){const on=(id,fn)=>{const el=$('#'+id);if(el)el.onclick=fn};on('shareTop',()=>enter());on('drawer',()=>{drawer=!drawer;render()});on('more',e=>{e.stopPropagation();if(scene==='empty'||scene==='generating')return;modal='menu';render()});on('menuShare',()=>{modal='';enter()});on('new',newChat);on('audio',()=>toast('声音设置已切换（演示）'));on('send',()=>{if(!$('#input').value.trim())return;scene='normal';$('#scene').value=scene;render();toast('已载入虚构示例会话')});on('back',()=>{shared=false;viewer='allowed';history.replaceState(null,'',location.href.split('#')[0]);render()});on('login',()=>{viewer='allowed';if(snapshot&&!shareExpired(snapshot))snapshot.loaded=true;render()});on('exit',()=>{selecting=false;selected.clear();render()});on('confirm',()=>{if(selected.size){newShareSettings();modal='confirm';render()}});on('all',e=>{selected=e.target.checked?new Set(eligible().map(m=>m.id)):new Set();render()});on('close',cancel);on('cancel',cancel);on('create',()=>create());on('continue',()=>create(true));on('retry',()=>create());on('copyAgain',copyLink);on('preview',openShared);on('unlockShare',async()=>{const p=$('#accessPassword').value;if(!p){passwordError='请输入访问密码';render();return}if(await shareHash(p)===snapshot.passwordHash){sessionStorage.setItem('share-unlocked-'+snapshot.id,snapshot.passwordHash);passwordError='';snapshot.loaded=!shareExpired(snapshot);render();if(snapshot.loaded)log('share_view_result',{link_id:snapshot.id,result:'success',is_sharer:false})}else{passwordError='密码错误，请重新输入';render()}});
document.querySelectorAll('[data-id]').forEach(el=>el.onchange=e=>{if(e.target.checked)selected.add(el.dataset.id);else selected.delete(el.dataset.id);const scroll=$('.scroll').scrollTop;render();$('.scroll').scrollTop=scroll});document.querySelectorAll('[data-group]').forEach(el=>el.onclick=()=>enter(Number(el.dataset.group)));document.querySelectorAll('[data-copy]').forEach(el=>el.onclick=async()=>{try{await navigator.clipboard.writeText(seed.find(m=>m.id===el.dataset.copy).text);toast('回答已复制')}catch(e){toast('剪贴板未授权，请手动复制')}});document.querySelectorAll('[data-speak]').forEach(el=>el.onclick=()=>{if(!('speechSynthesis'in window)){toast('当前浏览器不支持播报');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(seed.find(m=>m.id===el.dataset.speak).text);u.lang='zh-CN';speechSynthesis.speak(u)});document.querySelectorAll('[data-vote]').forEach(el=>el.onclick=()=>{el.style.color='var(--blue)';toast(el.dataset.vote==='like'?'已点赞':'已记录反馈')});document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>el.dataset.nav==='0'?newChat():toast('本 Demo 聚焦会话分享'));
const row=$('#conversation');if(!row)return;if(!row)return;if(!row)return;let hold;row.onpointerdown=()=>{if(mode!=='mobile'||scene==='empty'||scene==='generating')return;hold=setTimeout(()=>{modal='menu';render()},550)};row.onpointerup=row.onpointercancel=row.onpointerleave=()=>clearTimeout(hold);row.oncontextmenu=e=>{e.preventDefault();if(mode==='mobile'&&scene!=='empty'&&scene!=='generating'){modal='menu';render()}};row.onclick=()=>{if(mode==='mobile')return;scene='normal';shared=false;$('#scene').value=scene;render()};if(modal)$('#close')?.focus()}
$('#web').onclick=()=>{mode='web';render()};$('#mobile').onclick=()=>{mode='mobile';render()};$('#scene').onchange=e=>{cancel();scene=e.target.value;shared=false;selecting=false;selected.clear();render()};$('#reset').onclick=()=>{cancel();scene='normal';$('#scene').value=scene;shared=false;selecting=false;selected.clear();history.replaceState(null,'',location.href.split('#')[0]);render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal)cancel();else if(selecting){selecting=false;render()}}});

function renderNotes(){document.querySelectorAll('.note-panel,.directory-panel').forEach(x=>x.remove());$('#annotations').textContent=annotations?'隐藏红色说明':'显示红色说明';if(annotations){const targets=shared?[['.header',5],['.shared-footer',6]]:modal?[['.dialog-head',modal==='result'?4:3]]:selecting?[['.selectionbar',2]]:[['#shareTop',1],['.tools .share',1]];for(const [sel,id] of targets){const t=$(sel);if(!t||!t.getClientRects().length)continue;const n=document.createElement('button');n.className='annotation';n.textContent=id;n.setAttribute('aria-label','说明 '+id);const r=t.getBoundingClientRect(),ar=$('#app').getBoundingClientRect();n.style.left=Math.max(5,r.left-ar.left-27)+'px';n.style.top=Math.max(4,r.top-ar.top)+'px';n.onclick=()=>{note=id;panel=false;renderNotes()};$('#app').append(n)}}if(note){const d=notes[note-1],n=document.createElement('section');n.className='note-panel';n.innerHTML='<button class="note-close" aria-label="关闭说明">×</button><h3>'+note+' · '+d[0]+'</h3><small>产品视角 · 边界与交互结果</small><p>'+d[1]+'</p><p>'+d[2]+'</p><small>'+d[3]+'</small>';document.body.append(n);n.querySelector('button').onclick=()=>{note=0;renderNotes()}}if(panel){const n=document.createElement('section');n.className='directory-panel';n.innerHTML='<button class="note-close">关闭目录</button><h3>目录与演示场景</h3>'+notes.map((d,i)=>'<button data-note="'+(i+1)+'">'+(i+1)+' · '+d[0]+'</button>').join('')+'<button id="demoRead">访问最近创建的分享链接（演示）</button><p>顶部场景控制用于模拟异常；仅本地数据，不调用真实服务。未登录仅模拟登录跳转，登录页面不在本期设计范围。</p>';document.body.append(n);n.querySelector('.note-close').onclick=()=>{panel=false;renderNotes()};n.querySelectorAll('[data-note]').forEach(x=>x.onclick=()=>{note=+x.dataset.note;panel=false;renderNotes()});$('#demoRead').onclick=()=>{if(!snapshot){toast('请先创建分享链接');return}panel=false;note=0;openShared()}}}
$('#annotations').onclick=()=>{annotations=!annotations;note=0;render()};$('#directory').onclick=()=>{panel=!panel;note=0;renderNotes()};

function loadHash(){const id=new URLSearchParams(location.hash.slice(1)).get('share');if(id){snapshot=store[id];shared=true;viewer='allowed';if(snapshot)snapshot.loaded=false;render()}else render()}window.addEventListener('hashchange',loadHash);window.addEventListener('pagehide',()=>{token++});loadHash();mountShareLab(document.querySelector('.lab'));function getSharePayload(){return snapshot&&!shareExpired(snapshot)?[url(),title,'来自 YiliBuddy 的会话分享'+(snapshot.passwordHash?' · 需访问密码':'')]:null}
