const title='新品上市方案 · 协作讨论',chart='<div class="chart"><div class="bars"><i style="height:35%"></i><i style="height:65%"></i><i style="height:95%"></i></div><small>协作步骤示意 · 虚构图形，非业务数据</small></div>';
const seed=[{id:'q1',g:1,role:'user',text:'帮我整理一份新品上市的内部协作清单。'},{id:'a1',g:1,role:'assistant',text:'先对齐信息，再准备内容，最后检查上线。',html:'<h3>新品上市，先理清协作链路</h3><p>下面是一份用于讨论的示例清单，帮助团队明确每一步的交付物。</p><table><tr><th>阶段</th><th>交付物</th><th>协作重点</th></tr><tr><td>信息对齐</td><td>产品信息卡</td><td>统一卖点与边界</td></tr><tr><td>内容准备</td><td>渠道内容包</td><td>文案与视觉评审</td></tr><tr><td>渠道执行</td><td>上线检查表</td><td>核对素材和入口</td></tr></table><p>建议先确认产品信息，再组织内容评审，减少重复修改。</p>'},{id:'q2',g:2,role:'user',text:'精简成三个步骤，并附一个示意图。'},{id:'a2',g:2,role:'assistant',text:'先对齐、再执行、最后复盘。',html:'<h3>三个步骤，形成一次闭环</h3><p><b>1. 对齐信息：</b>确认定位、目标用户与渠道。</p><p><b>2. 协同执行：</b>完成内容评审和上线检查。</p><p><b>3. 记录复盘：</b>汇总问题，沉淀下一次协作清单。</p>'+chart+'<div class="filecard">▤ 上市协作清单.xlsx<br><small>静态文件卡片 · 不提供原文件下载</small></div><p>先从一个渠道试行，再根据反馈完善。</p>'},{id:'q3',g:3,role:'user',text:'最后给我一句适合同步给同事的结论。'},{id:'a3',g:3,role:'assistant',text:'先对齐产品信息，再用清单推进执行，最后把问题沉淀为下一次的改进。',html:'<p><b>先对齐产品信息，再用清单推进执行，最后把问题沉淀为下一次的改进。</b></p><p>可以分享完整会话，也可以只选择需要同步的内容。</p>'}];

function message(m,readOnly=false){let content=m.role==='user'?`<div class="bubble">${esc(m.text)}</div>`:`<div class="answer">${m.html||esc(m.text)}</div>`;if(m.done===false)content='<div class="answer"><span class="spin"></span>正在生成回答…<br><small style="color:#98a4b2">完成后可选择</small></div>';const cb=selecting&&!readOnly?`<input class="check" type="checkbox" data-id="${m.id}" aria-label="选择${m.role==='user'?'问题':'回答'} ${m.g}" ${selected.has(m.id)?'checked':''} ${m.done===false?'disabled':''}>`:'';const tools=m.role==='assistant'&&!readOnly&&!selecting&&m.done!==false?`<div class="tools"><button data-copy="${m.id}" aria-label="复制回答">${icon('copy')}</button><button data-speak="${m.id}" aria-label="播报回答">${icon('sound')}</button><button data-vote="like" aria-label="点赞">${icon('like')}</button><button data-vote="dislike" aria-label="点踩">${icon('dislike')}</button><button class="share share-icon" aria-label="分享" data-tip="分享" data-group="${m.g}">${icon('share')}</button><small>用时 9s</small></div>`:'';return `<article class="msg ${m.role}">${cb}${content}${tools}</article>`}

function welcome(){return '<div class="welcome"><span class="avatar">🧑🏻‍💻</span><h1>你好，演示用户</h1><p>我是 YiliBuddy，更懂伊利的办公搭子。<br>一句话帮你做分析、做调研、查制度，更多能力等你探索。</p><div class="chips"><span>♧ 图片/视频生成</span><span>▥ 数据分析</span><span>◇ 深度研究</span></div></div>'}
function render(){$('.viewer')?.remove();const app=$('#app');app.className='app'+(shared?' shared':'')+(mode==='mobile'?' mobile':'')+(drawer?' drawer':'');$('#web').classList.toggle('active',mode==='web');$('#mobile').classList.toggle('active',mode==='mobile');let header,content,footer;const ms=msgs();if(shared){header='<span class="title">YiliBuddy <small>来自分享的对话</small></span>';const bad=!snapshot||viewer==='denied'||viewer==='revoked'||(snapshot.expires<=Date.now()&&!snapshot.loaded);content=viewer==='login'?'<div class="empty"><p>正在跳转至现有统一登录…</p></div>':bad?'<div class="empty"><h2>该分享链接暂时无法访问</h2><p>请返回 YiliBuddy</p></div>':`<div class="thread"><div class="shared-label">该对话来自分享，由 AI 生成，请仔细甄别。</div><h2>${title}</h2><div class="shared-meta">分享时间 ${fmt(snapshot.created)}<br>失效时间 ${fmt(snapshot.expires)}</div>${snapshot.messages.map(m=>message(m,true)).join('')}</div>`;footer='<div class="shared-footer"><button class="primary" id="new">快速新建对话</button></div>'}else{header=`<button id="drawer" class="mobile-only" aria-label="会话列表">${icon('menu')}</button><span class="title">${ms.length?title:'YiliBuddy'}</span><button class="share-icon web-only" aria-label="分享" data-tip="分享" id="shareTop" ${ms.length?'':'hidden'}>${icon('share')}</button><button class="mobile-only" id="audio" aria-label="声音">${icon('sound')}</button>`;content=ms.length?`<div class="thread ${selecting?'selecting':''}">${ms.map(m=>message(m)).join('')}</div>`:welcome();footer=selecting?`<div class="selectionbar"><label><input id="all" type="checkbox" ${selected.size===eligible().length?'checked':''}>全选</label><span>已选 ${selected.size} 条消息</span><span class="grow"></span><button id="exit">取消</button><button class="primary" id="confirm" ${selected.size?'':'disabled'}>创建分享链接</button></div>`:'<div class="composer"><input id="input" placeholder="输入指令或 @引用消息" aria-label="消息输入"><div class="composer-actions"><span>＋</span><span>♧ 非涉密模型</span><span>♙ 总是询问</span><button class="send" id="send" aria-label="发送">↑</button></div></div><div class="footnote">内容由 AI 生成 · 交互演示使用虚构数据</div><nav class="bottomnav"><span><b>▧</b>趋势</span><span><b>◇</b>服务</span><span class="active"><b>YILI</b>YILI-AI</span><span><b>◎</b>互动</span><span><b>☻</b>我的</span></nav>'}
app.innerHTML=(shared?'':side())+`<main class="main"><div class="status"><span>14:07</span><span>▮▮▮ 5G ▰</span></div><header class="header">${header}</header><div class="scroll">${content}</div>${footer}</main>`+(modal?dialog():'');bind();if(shared&&snapshot)viewControls();renderNotes();$('.stage').style.height=`calc(100dvh - ${$('.lab').offsetHeight}px)`}
function dialog(){let body='',actions='';if(modal==='menu'){body='<button class="nav" id="menuShare">复制链接</button>'}else if(modal==='confirm'){body=`<p>已选择 ${selected.size} 条消息，按原顺序分享。</p><div class="notice">仅限已登录且具备 Yili Buddy 使用权限的内部用户，链接可内部转发。<br>分享为所选内容的静态快照，有效 7×24 小时。<br>本期不支持主动撤回，请先检查敏感信息。</div>`;actions='<button class="outline" id="cancel">取消</button><button class="primary" id="create">确认并复制链接</button>'}else if(modal==='missing'){body='<p>以下内容无法包含在分享中，继续分享将使用占位说明。</p><div class="notice">第 2 组回答 · 协作步骤示意图片<br>图片资源不允许共享，其余已选文字仍可分享。</div>';actions='<button class="outline" id="cancel">取消</button><button class="primary" id="continue">仍然分享</button>'}else if(modal==='loading'){body='<p><span class="spin"></span>正在准备静态快照…</p><div class="notice">关闭或取消将终止本次生成，不复制或交付链接。</div>';actions='<button class="outline" id="cancel">取消生成</button>'}else if(modal==='error'){body='<p>链接生成失败，请重试。</p><div class="notice">本次未发布链接，原会话不受影响。</div>';actions='<button class="outline" id="cancel">关闭</button><button class="primary" id="retry">重试</button>'}else if(modal==='result'){body=`<div class="notice">内部用户访问 · 所选内容静态快照<br>7 天有效，本期不支持主动撤回</div><div class="linkbox"><input id="url" readonly aria-label="分享链接" value="${esc(url())}"><button id="copyAgain" ${copyBusy?'disabled':''} aria-label="复制链接">${copyBusy?'复制中…':copyOK?'✓ 已复制':'复制链接'}</button></div><div class="expiry">失效时间 ${fmt(snapshot.expires)}</div>${copyOK||copyBusy?'':'<p style="color:#b57532">自动复制失败，请手动复制。</p>'}`;actions='<button class="primary" id="cancel">完成</button>'}return `<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-label="创建分享链接"><div class="dialog-head"><h2>${modal==='menu'?'会话操作':'创建分享链接'}</h2><button id="close" class="close" aria-label="关闭">×</button></div>${body}<div class="actions">${actions}</div></section></div>`}
const url=()=>location.href.split('#')[0]+'#share='+snapshot.id;async function copyLink(){if(copyBusy||!snapshot)return;copyBusy=true;copyOK=false;const current=snapshot.id;const value=url();if(modal==='result')render();let ok=false;if(scene!=='copyfail'){try{await navigator.clipboard.writeText(value);ok=true}catch(e){}}log('share_copy_result',{link_id:current,result:ok?'success':'failed'});copyBusy=false;if(snapshot?.id!==current)return;copyOK=ok;if(modal==='result'){render();if(ok)toast('链接已复制')}}
function create(allowMissing=false){if(scene==='missing'&&selected.has('a2')&&!allowMissing){modal='missing';render();return}const chosen=msgs().filter(m=>selected.has(m.id)&&m.done).map(m=>({...m}));if(!chosen.length)return;const t=++token;modal='loading';render();log('share_create_start',{selected_message_count:chosen.length});setTimeout(async()=>{if(t!==token)return;if(scene==='createfail'||(scene==='resourcefail'&&selected.has('a2'))){modal='error';log('share_create_result',{result:'failed'});render();return}if(allowMissing){const m=chosen.find(m=>m.id==='a2');if(m)m.html=m.html.replace(chart,'<div class="placeholder">该内容未包含在分享中 · 图片</div>')}const now=Date.now();snapshot={id:'demo-'+now.toString(36)+'-'+Math.random().toString(36).slice(2,7),created:now,expires:now+7*86400000,messages:chosen,selectionMode:chosen.length===eligible().length?'all':'partial'};store[snapshot.id]=snapshot;save();log('share_create_result',{result:'success',link_id:snapshot.id,selection_mode:snapshot.selectionMode,selected_message_count:chosen.length});modal='result';render();await copyLink()},1400)}
function openShared(){shared=true;selecting=false;drawer=false;modal='';viewer='allowed';snapshot.loaded=snapshot.expires>Date.now();render();if(snapshot.loaded)log('share_view_result',{link_id:snapshot.id,result:'success',is_sharer:false})}
function viewControls(){$('.viewer')?.remove();const n=document.createElement('div');n.className='viewer';n.innerHTML='<span>访问演示：</span><button id="viewLogin">未登录</button><button id="viewDenied">无产品权限</button><button id="expire">模拟到期</button><button id="refresh">重新请求</button><button id="revoke">提前失效</button>';$('.lab').append(n);$('#viewLogin').onclick=()=>{viewer='login';render()};$('#viewDenied').onclick=()=>{viewer='denied';render()};$('#expire').onclick=()=>{snapshot.expires=Date.now()-1;store[snapshot.id]={...snapshot,loaded:false};save();toast('已模拟自然到期，当前内容保留；重新请求后提示失效')};$('#refresh').onclick=()=>{snapshot.loaded=false;render()};$('#revoke').onclick=()=>{viewer='revoked';render()}}
function newChat(){cancel();shared=false;selecting=false;drawer=false;scene='empty';$('#scene').value=scene;history.replaceState(null,'',location.href.split('#')[0]);render()}
function bind(){const on=(id,fn)=>{const el=$('#'+id);if(el)el.onclick=fn};on('shareTop',()=>enter());on('drawer',()=>{drawer=!drawer;render()});on('more',e=>{e.stopPropagation();if(scene==='empty'||scene==='generating')return;modal='menu';render()});on('menuShare',()=>{modal='';enter()});on('new',newChat);on('audio',()=>toast('声音设置已切换（演示）'));on('send',()=>{if(!$('#input').value.trim())return;scene='normal';$('#scene').value=scene;render();toast('已载入虚构示例会话')});on('back',()=>{shared=false;viewer='allowed';history.replaceState(null,'',location.href.split('#')[0]);render()});on('login',()=>{viewer='allowed';if(snapshot&&snapshot.expires>Date.now())snapshot.loaded=true;render()});on('exit',()=>{selecting=false;selected.clear();render()});on('confirm',()=>{if(selected.size){modal='confirm';render()}});on('all',e=>{selected=e.target.checked?new Set(eligible().map(m=>m.id)):new Set();render()});on('close',cancel);on('cancel',cancel);on('create',()=>create());on('continue',()=>create(true));on('retry',()=>create());on('copyAgain',copyLink);on('preview',openShared);
document.querySelectorAll('[data-id]').forEach(el=>el.onchange=e=>{if(e.target.checked)selected.add(el.dataset.id);else selected.delete(el.dataset.id);const scroll=$('.scroll').scrollTop;render();$('.scroll').scrollTop=scroll});document.querySelectorAll('[data-group]').forEach(el=>el.onclick=()=>enter(Number(el.dataset.group)));document.querySelectorAll('[data-copy]').forEach(el=>el.onclick=async()=>{try{await navigator.clipboard.writeText(seed.find(m=>m.id===el.dataset.copy).text);toast('回答已复制')}catch(e){toast('剪贴板未授权，请手动复制')}});document.querySelectorAll('[data-speak]').forEach(el=>el.onclick=()=>{if(!('speechSynthesis'in window)){toast('当前浏览器不支持播报');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(seed.find(m=>m.id===el.dataset.speak).text);u.lang='zh-CN';speechSynthesis.speak(u)});document.querySelectorAll('[data-vote]').forEach(el=>el.onclick=()=>{el.style.color='var(--blue)';toast(el.dataset.vote==='like'?'已点赞':'已记录反馈')});document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>el.dataset.nav==='0'?newChat():toast('本 Demo 聚焦会话分享'));
const row=$('#conversation');if(!row)return;if(!row)return;if(!row)return;let hold;row.onpointerdown=()=>{if(mode!=='mobile'||scene==='empty'||scene==='generating')return;hold=setTimeout(()=>{modal='menu';render()},550)};row.onpointerup=row.onpointercancel=row.onpointerleave=()=>clearTimeout(hold);row.oncontextmenu=e=>{e.preventDefault();if(mode==='mobile'&&scene!=='empty'&&scene!=='generating'){modal='menu';render()}};row.onclick=()=>{if(mode==='mobile')return;scene='normal';shared=false;$('#scene').value=scene;render()};if(modal)$('#close')?.focus()}
$('#web').onclick=()=>{mode='web';render()};$('#mobile').onclick=()=>{mode='mobile';render()};$('#scene').onchange=e=>{cancel();scene=e.target.value;shared=false;selecting=false;selected.clear();render()};$('#reset').onclick=()=>{cancel();scene='normal';$('#scene').value=scene;shared=false;selecting=false;selected.clear();history.replaceState(null,'',location.href.split('#')[0]);render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal)cancel();else if(selecting){selecting=false;render()}}});

const notes=[
['分享入口','Web 非空会话右上角、双端已完成回答工具栏展示分享图标。Web 悬停/键盘聚焦提示“分享”，移动端直接点击；不增加分享旁的新建加号。','会话级入口默认全选；回答入口默认当前问答。空会话隐藏 Web 入口；生成中回答不展示工具栏分享。','PFR-01/02 · PAC-01/02'],
['选择内容','问题、回答分别勾选；全选仅包含已完成消息，生成中回答禁选。显示实际已选数量。','零选择不可创建；取消返回原会话不创建链接；当前回答入口定位并短暂高亮所属问答。','PFR-01/02/04 · PAC-23～25'],
['确认与生成','确认内部访问、静态快照、7×24 小时有效期、不支持主动撤回。确认后禁重复提交。','生成中关闭或取消终止本次；可恢复故障未恢复不发布链接，保留选择供重试；不可共享资源仅在明确确认后占位。','PFR-03/04/09 · PAC-03/26/27'],
['链接结果与再次复制','成功结果在原弹窗/底部弹层展示只读链接、复制按钮、精确失效时间，底部仅保留“完成”。','“已复制”仍可点击，复制处理中禁重复，成功提示“链接已复制”；失败提示手动复制且保留同一链接和期限。完成关闭结果及选择页面，返回普通会话；不撤回链接。','PFR-05 · PAC-04/05/26/27'],
['分享阅读页','双端单栏展示品牌、标题、时间和所选消息静态内容；不显示原会话侧栏、返回会话、输入框或继续聊。','未登录直接进入现有统一登录，本 Demo 仅说明跳转不设计登录页；登录回跳后重新鉴权。自然到期保留已读内容，重新请求拒绝；提前失效清空。','PFR-06～10 · PAC-07～14'],
['快速新建对话','双端底部悬浮“快速新建对话”，长内容滚动时保持可见，正文留足底部空间。','点击进入 YiliBuddy 空白新建对话并停留，不继承分享正文、文件或上下文；不提供继续聊。','PFR-11 · PAC-15']];
function renderNotes(){document.querySelectorAll('.note-panel,.directory-panel').forEach(x=>x.remove());$('#annotations').textContent=annotations?'隐藏红色说明':'显示红色说明';if(annotations){const targets=shared?[['.header',5],['.shared-footer',6]]:modal?[['.dialog-head',modal==='result'?4:3]]:selecting?[['.selectionbar',2]]:[['#shareTop',1],['.tools .share',1]];for(const [sel,id] of targets){const t=$(sel);if(!t||!t.getClientRects().length)continue;const n=document.createElement('button');n.className='annotation';n.textContent=id;n.setAttribute('aria-label','说明 '+id);const r=t.getBoundingClientRect(),ar=$('#app').getBoundingClientRect();n.style.left=Math.max(5,r.left-ar.left-27)+'px';n.style.top=Math.max(4,r.top-ar.top)+'px';n.onclick=()=>{note=id;panel=false;renderNotes()};$('#app').append(n)}}if(note){const d=notes[note-1],n=document.createElement('section');n.className='note-panel';n.innerHTML='<button class="note-close" aria-label="关闭说明">×</button><h3>'+note+' · '+d[0]+'</h3><small>产品视角 · 边界与交互结果</small><p>'+d[1]+'</p><p>'+d[2]+'</p><small>'+d[3]+'</small>';document.body.append(n);n.querySelector('button').onclick=()=>{note=0;renderNotes()}}if(panel){const n=document.createElement('section');n.className='directory-panel';n.innerHTML='<button class="note-close">关闭目录</button><h3>目录与演示场景</h3>'+notes.map((d,i)=>'<button data-note="'+(i+1)+'">'+(i+1)+' · '+d[0]+'</button>').join('')+'<button id="demoRead">访问最近创建的分享链接（演示）</button><p>顶部场景控制用于模拟异常；仅本地数据，不调用真实服务。未登录仅模拟登录跳转，登录页面不在本期设计范围。</p>';document.body.append(n);n.querySelector('.note-close').onclick=()=>{panel=false;renderNotes()};n.querySelectorAll('[data-note]').forEach(x=>x.onclick=()=>{note=+x.dataset.note;panel=false;renderNotes()});$('#demoRead').onclick=()=>{if(!snapshot){toast('请先创建分享链接');return}panel=false;note=0;openShared()}}}
$('#annotations').onclick=()=>{annotations=!annotations;note=0;render()};$('#directory').onclick=()=>{panel=!panel;note=0;renderNotes()};

function loadHash(){const id=new URLSearchParams(location.hash.slice(1)).get('share');if(id){snapshot=store[id];shared=true;viewer='allowed';if(snapshot)snapshot.loaded=false;render()}else render()}window.addEventListener('hashchange',loadHash);window.addEventListener('pagehide',()=>{token++});loadHash();window.demo={enter,create,cancel,openShared,eligible,getState:()=>({mode,scene,selecting,selected:[...selected],modal,snapshot,shared,events})};
