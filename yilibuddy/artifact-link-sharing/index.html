if(outcome?.canceled||/cancel/i.test(outcome?.errMsg||outcome?.err_msg||''))return;if(outcome?.errCode&&outcome.errCode!==0)throw new Error('sdk_failed');wcStatus='已分享';}catch(e){if(/cancel/i.test(e?.errMsg||e?.message||'')){wcStatus='';return}wcFailed=true;wcStatus='分享失败，请重试或复制链接后发送。'}finally{wcBusy=false;render()}}

markRead(l);return '<div class="sharelayout"><header class="sharehead"><span class="brand">YiliBuddy <small>来自分享的文件</small></span><div class="head-actions"><button data-action="copyShare">'+(S.copy==='success'?'已复制':'复制链接')+'</button><button data-action="download" '+(canRead(l)?'':'disabled')+'>下载文件</button></div></header><div class="shared-reading"><section class="sharemeta">'+noteButton(3)+'<h2>'+esc(l.title)+'</h2><div class="meta"><span>'+esc(formats[l.format].label)+'</span><span>分享时间 '+stamp(l.generated)+'</span><span>失效时间 '+shareTTL(l)+'</span></div>'+(S.copy==='failed'?'<div class="copyline"><input readonly value="'+esc(copyUrl(l.id))+'" aria-label="当前分享链接"><span>'+MSG.copyFail+'</span></div>':'')+'</section>'+preview(l.format,false)+'</div><button class="share-revisit" data-action="home" aria-label="返回 YiliBuddy" title="返回 YiliBuddy"><span class="revisit-avatar">Y</span>YiliBuddy 生成</button></div>'}

function downloadFile(){
const l=S.mode==='share'?lastLink():null,f=l?l.format:S.format;
if(S.role==='login'){S.loaded=null;render();return;}
if(l&&!canRead(l)){toast(linkState(l)==='expired'?'该链接已过期':MSG.unavailable);return;}
if(fault('download')){toast('下载失败，请重试。');return;}
let blob;if(OFFICE[f]){const item=OFFICE[f],raw=atob(item.base64);blob=new Blob([Uint8Array.from(raw,c=>c.charCodeAt(0))],{type:item.mime});}
else{let content=TEXT[f];if(f==='html')content='<!doctype html><meta charset="utf-8"><title>页面分享测试</title><style>body{font:16px sans-serif;max-width:700px;margin:80px auto;text-align:center}button{padding:12px}</style>'+wordPaper('html');blob=new Blob([content||''],{type:f==='html'?'text/html;charset=utf-8':f==='csv'?'text/csv;charset=utf-8':'text/plain;charset=utf-8'});}
const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=l?l.title:filename(f);document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
event('share_download_result',{link_id:l?l.id:null,result:'success',format:f});toast('下载已开始。');
}

function dialog(){if(S.dialog==='loading')return shareGenerationDialog('分享文档','data-action="cancel"','data-action="cancel"');if(S.dialog==='generationError')return shareGenerationDialog('分享文档','data-action="closeDialog"','data-action="closeDialog"',true,'data-action="retryGeneration"');if(S.dialog==='settings')return '<div class="overlay"><section class="dialog share-dialog" role="dialog" aria-modal="true" aria-label="分享文档"><div class="dialog-title">分享文档<button data-action="closeDialog" aria-label="关闭设置">×</button></div><p>'+shareHint()+'</p>'+shareFields()+'<div class="bottom"><button data-action="closeDialog">取消</button><button class="share-primary" data-action="confirmSettings" '+(S.preparing?'disabled':'')+'>创建链接</button></div></section></div>';const l=db.links[S.dialog];if(!l)return '';return '<div class="overlay" id="overlay"><section class="dialog share-dialog" role="dialog" aria-modal="true" aria-label="分享文档"><div class="dialog-title"><span id="dialogTitle">分享文档</span><button data-action="closeDialog" aria-label="关闭结果">×</button></div><p>'+shareHint()+'</p>'+shareLinkRow(copyUrl(l.id),'shareLink','artifactCopy','copy',S.copy)+'<div class="share-result-meta"><p>有效期：'+shareTTL(l)+'</p>'+(l.passwordHash?'<p>访问密码：<input readonly aria-label="本次访问密码" value="'+esc(shareDraft.password)+'"></p>':'')+'</div>'+(S.copy==='failed'?'<p class="share-error" role="alert">'+MSG.copyFail+'</p>':'')+wcButton()+'<div class="bottom"><button data-action="closeDialog">完成</button></div></section></div>'}
function capturePage(){const vp=$('previewViewport'),second=$('secondPage'),stage=$('stage');if(vp&&second&&stage&&vp.scrollHeight>vp.clientHeight+1)S.page=vp.scrollTop+vp.clientHeight*.8>=second.offsetTop*(+stage.dataset.scale||1)?2:1}
function layoutPaper(){
const vp=$('previewViewport'),paper=$('paper'),stage=$('stage');if(!vp||!paper||!stage)return;
const available=Math.max(1,vp.clientWidth-24),scale=S.zoomMode==='fit'?Math.min(1,available/760):S.zoom;
const prevWidth=+stage.dataset.width||0,prevScale=+stage.dataset.scale||0;
paper.style.transform='scale('+scale+')';const width=760*scale;stage.style.width=width+'px';stage.style.height=paper.scrollHeight*scale+'px';stage.style.margin=width<=available?'0 auto':'0';
stage.dataset.scale=String(scale);stage.dataset.width=String(vp.clientWidth);
if(S.zoomMode==='fit')vp.scrollLeft=0;else if(width>available&&(prevScale!==scale||prevWidth!==vp.clientWidth))vp.scrollLeft=(vp.scrollWidth-vp.clientWidth)/2;
const minus=document.querySelector('[data-action="minus"]'),plus=document.querySelector('[data-action="plus"]');if(minus)minus.disabled=scale<=.5;if(plus)plus.disabled=scale>=2;
}
function render(){if(RO){RO.disconnect();RO=null}$('canvas').classList.toggle('phone',S.device==='mobile');$('locationLabel').textContent=(S.device==='mobile'?'移动端分享':'Web')+' / '+(S.mode==='share'?'分享页':'原产物页');$('product').innerHTML=(S.mode==='share'?sharePage():sourcePage())+(S.dialog?dialog():'')+(S.notice&&S.gen!=='failed'?'<div class="toast" role="status">'+esc(S.notice)+'</div>':'');requestAnimationFrame(()=>{layoutPaper();const vp=$('previewViewport');if(vp){RO=new ResizeObserver(layoutPaper);RO.observe(vp);const currentPaper=$('paper');if(currentPaper)RO.observe(currentPaper);if(S.page>1&&$('secondPage'))vp.scrollTop=$('secondPage').offsetTop*(+($('stage').dataset.scale||1));}});updateInspector()}
function resourceAction(callback){const l=lastLink();if(S.mode==='share'&&!canRead(l)){S.resourceError=MSG.unavailable;render();return false}S.resourceError='';callback();render();return true}
function updateInspector(){const picker=$('linkPicker');if(picker){picker.innerHTML=Object.values(db.links).filter(l=>l.delivered).map((l,i)=>'<option value="'+esc(l.id)+'">'+(i+1)+' · '+esc(formats[l.format].label)+' · '+esc(linkState(l))+'</option>').join('')||'<option value="">尚无已交付链接</option>';picker.value=S.currentId||''}}
function chooseDirectory(type){if(type==='source'){cancel();S.mode='source';S.role='creator';$('role').value=S.role;S.preview=false;S.loaded=null;S.zoomMode='fit';render()}else if(type==='share')openShare();else if(type==='mobile'){S.device='mobile';$('device').value='mobile';if(lastLink())openShare();else{S.mode='source';S.preview=false;render()}}else{showNote(5);demoStatus('核心数据口径见 PRD；验收页面不展示事件流水。')}document.querySelectorAll('#directory button').forEach(b=>b.classList.toggle('active',b.dataset.dir===type))}
notes.push(...SHARE_REVIEW.map((d,i)=>[(i+7)+' · '+d.title,d.rules+' '+d.error+' '+d.trace]));
$('directory').innerHTML=[['source','原产物 / Word 适宽'],['share','有效分享 / 格式阅读'],['mobile','移动端 / 底部结果'],['data','分享规则说明']].map(([k,v])=>'<button data-dir="'+k+'">'+v+'</button>').join('');
$('format').innerHTML=Object.entries(formats).map(([k,v])=>'<option value="'+k+'">'+v.label+'</option>').join('');$('format').value=S.format;
$('annotations').innerHTML=notes.map((n,i)=>'<button data-note="'+i+'">'+n[0]+'</button>').join('');$('noteDetail').textContent=notes[0][1];
$('directory').onclick=e=>{const b=e.target.closest('[data-dir]');if(b)chooseDirectory(b.dataset.dir)};
$('annotations').onclick=e=>{const b=e.target.closest('[data-note]');if(b){S.note=+b.dataset.note;$('noteDetail').textContent=notes[S.note][1]}};
$('toggleNotes').onclick=()=>{const off=document.body.classList.toggle('notes-off');$('toggleNotes').textContent=off?'显示红色说明':'隐藏红色说明';if(off)$('annotationCard').hidden=true};
function directoryVisible(on){$('demoPanel').hidden=!on;$('toggleDirectory').setAttribute('aria-expanded',String(on))}
$('toggleDirectory').onclick=()=>directoryVisible($('demoPanel').hidden);$('closeDirectory').onclick=()=>directoryVisible(false);$('closeAnnotation').onclick=()=>$('annotationCard').hidden=true;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){directoryVisible(false);$('annotationCard').hidden=true}});
$('device').onchange=()=>{cancel();S.device=$('device').value;S.full=false;S.zoomMode='fit';render()};
$('format').onchange=()=>{cancel();S.format=$('format').value;S.mode='source';S.role='creator';$('role').value='creator';S.preview=false;S.gen='idle';S.notice='';S.resourceError='';S.previewError=false;S.previewLoading=false;S.bodyError=false;S.full=false;S.sheet=0;S.slide=0;S.page=1;S.zoomMode='fit';render()};
$('role').onchange=()=>{cancel();S.role=$('role').value;if(S.role==='login'&&lastLink())sessionStorage.removeItem('share-unlocked-'+lastLink().id);S.loaded=null;S.dialog=null;S.copy='idle';render()};
$('fault').onchange=()=>demoStatus('下一次对应操作生效一次；已有文件与有效链接保留。');
$('openShare').onclick=openShare;
$('linkPicker').onchange=()=>{S.currentId=$('linkPicker').value||null;S.loaded=null;S.bodyError=false;S.dialog=null;S.resourceError='';render();demoStatus('已切换示例链接；不创建新链接。')};
$('naturalExpire').onclick=()=>{const l=lastLink();if(!l)return demoStatus('请先生成链接。');if(l.expires==null)return demoStatus('永久链接没有自然到期时间；请选择限时链接验收。');db.clockOffset=Math.max(db.clockOffset||0,l.expires-Date.now()+1);save();render();demoStatus('自然到期：已加载内容保留，重新访问/新资源请求拒绝。')};
$('fresh').onclick=()=>{cancel();S.loaded=null;S.bodyError=false;S.resourceError='';S.dialog=null;render();demoStatus('已按当前链接与角色重新访问。')};
$('reset').onclick=()=>{clearTimeout(timer);clearTimeout(noticeTimer);db={links:{},events:[]};localStorage.removeItem(KEY);S={device:'web',format:'word',role:'creator',mode:'source',preview:false,full:false,zoomMode:'fit',zoom:1,page:1,sheet:0,slide:0,gen:'idle',job:null,dialog:null,copy:'idle',notice:'',resourceError:'',loaded:null,currentId:null,note:0};['device','format','role','fault'].forEach(id=>$(id).value={device:'web',format:'word',role:'creator',fault:'normal'}[id]);demoStatus('已重置：无分享记录、无访问事件。');render()};
$('product').onclick=e=>{const n=e.target.closest('[data-note]');if(n){showNote(+n.dataset.note);return}const b=e.target.closest('[data-action],[data-sheet]')||(e.target.closest('.artifact')?e.target.closest('.artifact').querySelector('.artifact-open'):null);if(!b||b.disabled)return;if(['plus','minus','fit','fullscreen','share','copy','copyShare'].includes(b.dataset.action))capturePage();if(b.dataset.sheet!==undefined){resourceAction(()=>S.sheet=+b.dataset.sheet);return}switch(b.dataset.action){case 'htmlDemo':toast('测试按钮已点击。');break;case 'share':if(S.gen!=='failed')newShareSettings();S.dialog='settings';render();break;case 'confirmSettings':confirmSettings();break;case 'retryGeneration':create();break;case 'unlockShare':unlockArtifact();break;case 'shareWecom':break;case 'cancel':cancel();break;case 'refreshPreview':cancel();S.zoomMode='fit';S.resourceError='';S.previewError=false;S.previewLoading=false;render();break;case 'openPreview':{S.preview=true;S.zoomMode='fit';S.previewLoading=true;S.previewError=false;const serial=++previewSerial;const failed=fault('body');render();setTimeout(()=>{if(serial===previewSerial&&S.preview){S.previewLoading=false;S.previewError=failed;render()}},450)}break;case 'retryPreview':S.previewError=false;S.previewLoading=false;render();break;case 'retryBody':S.bodyError=false;S.loaded=null;render();break;case 'closePreview':cancel();previewSerial++;S.previewLoading=false;S.previewError=false;S.preview=false;S.full=false;render();break;case 'fullscreen':S.full=!S.full;render();break;case 'download':downloadFile();break;case 'closeDialog':settingsSerial++;S.preparing=false;S.dialog=null;S.copy='idle';render();break;case 'copy':doCopy(S.dialog);break;case 'copyShare':doCopy(S.currentId);break;case 'login':S.role='viewer';$('role').value='viewer';render();break;case 'home':cancel();S.mode='source';S.loaded=null;S.preview=false;S.dialog=null;render();break;case 'fit':S.zoomMode='fit';render();break;case 'plus':S.zoomMode='manual';S.zoom=[.5,1,1.5,2].find(v=>v>(+($('stage')&&$('stage').dataset.scale)||1)+.01)||2;render();break;case 'minus':S.zoomMode='manual';S.zoom=[.5,1,1.5,2].filter(v=>v<(+($('stage')&&$('stage').dataset.scale)||1)-.01).pop()||.5;render();break;case 'jump':{const value=$('pageInput').value,f=S.mode==='share'?lastLink().format:S.format,count=f==='ppt'?slideModels.length:documentPages.length;if(!/^\d+$/.test(value)||+value<1||+value>count){toast('请输入 1 至 '+count+' 之间的页码。');break}resourceAction(()=>{if((S.mode==='share'?lastLink().format:S.format)==='ppt')S.slide=+value-1;else S.page=+value});break}case 'prev':resourceAction(()=>S.slide=Math.max(0,S.slide-1));break;case 'next':resourceAction(()=>S.slide=Math.min(slideModels.length-1,S.slide+1));break;case 'retryResource':resourceAction(()=>S.resourceError='');break;}};
$('product').onchange=e=>{if(e.target.id==='zoomSelect'){capturePage();if(e.target.value==='fit')S.zoomMode='fit';else{S.zoomMode='manual';S.zoom=+e.target.value}render()}};
$('product').addEventListener('focusin',e=>{if(e.target.readOnly&&e.target.tagName==='INPUT')e.target.select()});
$('product').onkeydown=e=>{if(e.key==='Enter'&&e.target.id==='pageInput'){const b=document.querySelector('[data-action="jump"]');if(b)b.click()}};
window.addEventListener('beforeunload',()=>{if(['generating','pending','unknown'].includes(S.gen))cancel()});
window.addEventListener('resize',layoutPaper);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.mode==='share'){try{db=JSON.parse(localStorage.getItem(KEY))||db}catch(e){}if(!authorized()||!['active','expired'].includes(linkState(lastLink())))S.loaded=null;render()}});
window.addEventListener('storage',e=>{if(e.key===KEY){try{db=JSON.parse(e.newValue)||{links:{},events:[]}}catch(x){}if(S.mode==='share'&&linkState(lastLink())!=='active'&&linkState(lastLink())!=='expired')S.loaded=null;render()}});
const route=new URL(location.href).searchParams.get('share');if(route){S.currentId=route;S.mode='share';S.role='viewer';$('role').value='viewer';const l=lastLink();if(l)S.format=l.format}
mountShareLab(document.getElementById('demoPanel'));
function getSharePayload(){const l=lastLink();return l&&linkState(l)==='active'?[copyUrl(l.id),l.title,formats[l.format].label+' · 登录 YiliBuddy 查看和下载'+(l.passwordHash?' · 需访问密码':'')]:null}
window.artifactDemo={snapshot:()=>JSON.parse(JSON.stringify({state:S,db})),messages:MSG};
render();
})();
