function hideRangeTooltip(){document.getElementById('rangeTooltip')?.remove();document.querySelectorAll('[aria-describedby="rangeTooltip"]').forEach(n=>n.removeAttribute('aria-describedby'));}
function showRangeTooltip(node){hideRangeTooltip();const tip=document.createElement('div');tip.id='rangeTooltip';tip.className='range-tooltip';tip.setAttribute('role','tooltip');const text=node.dataset.rangeTooltip;const index=text.indexOf('：');const heading=document.createElement('b');heading.textContent=text.slice(0,index);tip.append(heading);const content=document.createElement('div');content.textContent=text.slice(index+1);tip.append(content);document.body.append(tip);node.setAttribute('aria-describedby','rangeTooltip');const rect=node.getBoundingClientRect(),box=tip.getBoundingClientRect();tip.style.left=Math.max(12,Math.min(rect.left,innerWidth-box.width-12))+'px';tip.style.top=(rect.bottom+8+box.height<innerHeight?rect.bottom+8:Math.max(12,rect.top-box.height-8))+'px';}
document.addEventListener('pointerover',ev=>{const node=ev.target.closest('[data-range-tooltip]');if(node)showRangeTooltip(node)});
document.addEventListener('pointerout',ev=>{const node=ev.target.closest('[data-range-tooltip]');if(node&&!node.contains(ev.relatedTarget))hideRangeTooltip()});
document.addEventListener('focusin',ev=>{const node=ev.target.closest('[data-range-tooltip]');if(node)showRangeTooltip(node)});

document.addEventListener('scroll',hideRangeTooltip,true);window.addEventListener('resize',hideRangeTooltip);

function resourceTree(withChecks=true,context=null){

function nodeInfo(){
