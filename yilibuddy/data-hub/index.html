11:['菜单与资产范围','C端详情只展示Logo、名称、类型、创建人／归属、订阅调用量、说明及关联能力；不展示后台状态、库表字段或范围配置。依赖可用则无需重复订阅，可订阅展示按钮，可申请二次确认后进入申请中，无可见权限不展示名称。数据集菜单始终存在，但只展示本人可见、已发布且当前渠道适用的资产。无可见资产时列表为空，AK 管理与默认问数仍可用。订阅资格和底层数据权限分开，零数据权限也不直接禁止订阅。'],
