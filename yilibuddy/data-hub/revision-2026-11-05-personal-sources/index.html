function sourceInfo(db){const kind=sourceKind(db),project=kind==='数据中台项目',rows=project?[]:[['类型',kind==='StarRocks'?null:db.type||db.source.split('/').pop().trim()],['版本信息',sourceProductVersion(db)],['负责人',db.owner||db.project+'数据团队'],['更新时间',db.updatedAt||'2026/11/03 14:20']];return '<span class="tag blue">'+kind+'</span> <span class="tag green">生产</span><h3 style="margin-top:16px">'+esc(resourceEnglishName(db))+'</h3><p class="mini muted">'+esc(sourceName(db))+'</p><table><tbody>'+rows.filter(x=>x[1]!==null).map(([k,v])=>'<tr><td class="muted" style="width:110px">'+k+'</td><td>'+esc(v||'未提供')+'</td></tr>').join('')+'</tbody></table>'}

function sourceResourceView(){
 const e=state.editor;
 if(!e)return empty('暂无资源');
 if(e.loading||state.resourceSync?.editor===e&&state.resourceSync.loading)return '<div class="resource-loading" role="status"><span aria-hidden="true"></span>正在加载本人有权资源…</div>';
 const kinds=['数据中台项目','业务数据库','StarRocks'],kind=state.sourceCategory,query=(state.resourceFilter||'').toLowerCase(),locked=configuredDbs();
 const choices=selectableDbs().filter(db=>sourceKind(db)===kind&&(resourceEnglishName(db)+' '+dbChinese(db)).toLowerCase().includes(query));
 const selected=choices.find(db=>db.id===state.node)||choices[0];
 const tabs=kinds.map(k=>btn(k,'sourceCategory','data-value="'+k+'"',k===kind?'active':'')).join('');
 const rows=choices.map(db=>'<div class="treeitem '+(db===selected?'selected':'')+'"><input type="checkbox" data-pick-db="'+esc(db.id)+'" '+(locked.has(db.id)||e.picked?.includes(db.id)?'checked':'')+' '+(locked.has(db.id)?'disabled':'')+' aria-label="选择 '+esc(resourceEnglishName(db))+'"><button data-action="node" data-id="'+esc(db.id)+'"><b>'+esc(resourceEnglishName(db))+'</b>'+dbSubtitle(db)+(locked.has(db.id)?'<small>已配置</small>':'')+'</button></div>').join('');
 return '<div class="tabs resource-category-tabs">'+tabs+'</div><div class="split detail-resource"><div class="tree">'+rows+'</div><div class="treebody">'+(selected?'<h3>'+esc(resourceEnglishName(selected))+'</h3>'+dbSubtitle(selected)+cataloguePreview(selected):empty('暂无匹配资源'))+'</div></div>';
}
function sourceLocalError(text){document.querySelectorAll('.source-local-error').forEach(n=>n.remove());let target=/名称/.test(text)?document.querySelector('[data-edit="name"]'):/标识/.test(text)?document.querySelector('[data-edit="identifier"]'):/AK|AccessKey|凭据/.test(text)?document.querySelector('.source-credential'):/渠道/.test(text)?document.querySelector('.advanced-config'):/范围/.test(text)?document.querySelector('.access-group'):document.querySelector('.source-resource');if(!target)target=document.getElementById('editorError');const msg=document.createElement('div');msg.className='error source-local-error';msg.setAttribute('role','alert');msg.textContent=text;target.insertAdjacentElement('afterend',msg);target.scrollIntoView({block:'center',behavior:'smooth'});if(target.matches('input'))target.focus()}
document.addEventListener('click',ev=>{let n=ev.target.closest('[data-action="sourceCategory"]');if(n){state.sourceCategory=n.dataset.value;const db=resources.find(x=>sourceKind(x)===state.sourceCategory);state.node=db?.id||'';state.detailNode=state.node;render()}if(ev.target.closest('[data-action="profileMenu"]')){state.profileOpen=!state.profileOpen;render()}});


function sourceCanManage(a){return state.identity==='platform'||state.identity==='business'&&a.department===current().department}

function syncSourceSubscriptions(){return}




for(const a of assets){a.publisherAccount=a.publisherAccount||"demo_"+a.owner;for(const cfg of [a.published,a.pending,a.draft])if(cfg){cfg.skills=[];cfg.knowledge=[];cfg.enh={};cfg.force=true;cfg.allowApply=false}}syncSourceSubscriptions();

document.addEventListener('click',ev=>{const n=ev.target.closest('[data-action]');if(!n)return;if(n.dataset.action==='sourceAdmin'){if(state.identity==='consumer')state.identity='business';route('admin')}if(n.dataset.action==='sourceUser')route('chat');if(n.dataset.action==='sourceSubmitDraft'){const a=assets.find(x=>x.id===n.dataset.id);if(!a||a.status!=='草稿'||a.pending||!sourceCanManage(a))return;a.pending=clone(a.draft);a.draft=null;a.status='待审核';a.submitter=current().id;a.submittedAt=nowText();a.updatedAt=a.submittedAt;a.submitOperation='上线';a.statusRequest=false;render();toast('已提交审核，请到审核中心处理。')}});

window.addEventListener('resize',positionPersonalReference);window.addEventListener('scroll',positionPersonalReference,true);window.visualViewport?.addEventListener('resize',positionPersonalReference);
initializePersonalSources();
const seeded=new Map();
for(const a of assets)for(const db of personalResources(a.published)){
 const item=databaseAsset(personalGroupResources(db)[0],a.owner,a.department);
 seeded.set(item.id,item);
}
assets.splice(0,assets.length,...seeded.values());
render();
